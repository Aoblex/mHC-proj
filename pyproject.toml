[project]
name = "mhc_proj"
version = "0.1.0"
description = "Accelerated Birkhoff Projection for Manifold-Constrained Hyper-Connections"
authors = [
    {name = "Yixuan Qiu", email = "yixuanq@gmail.com"},
]
maintainers = [
    {name = "Yixuan Qiu", email = "yixuanq@gmail.com"},
]
license = "MIT"
readme = "README.md"
requires-python = ">= 3.12"
dependencies = [
    "torch>=2.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
benchmark = [
    "apache-tvm-ffi==0.1.11",
    "matplotlib>=3.10",
    "tilelang==0.1.10",
]

[project.urls]
Homepage = "https://github.com/yixuan/mHC-proj"
Issues = "https://github.com/yixuan/mHC-proj/issues"

[build-system]
requires = ["torch >= 2.8.0", "setuptools >= 80.0"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
# Only build on CPython
build = "cp*"

[tool.pytest.ini_options]
pythonpath = ["."]
